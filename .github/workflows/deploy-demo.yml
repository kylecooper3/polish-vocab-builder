name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-demo.yml"

# Only the frontend is published. It has no backend, so it uses saved results for one book.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the demo
        run: npm run build -- --base=/polish-vocab-builder/
        env:
          VITE_DEMO_MODE: "true"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
